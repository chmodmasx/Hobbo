name: Model smoke tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/model-smoke.yml'
      - 'models/**'
      - 'scripts/ci/**'
      - 'packages/ai-provider/**'
  pull_request:
    paths:
      - '.github/workflows/model-smoke.yml'
      - 'models/**'
      - 'scripts/ci/**'
      - 'packages/ai-provider/**'

permissions:
  contents: read

concurrency:
  group: model-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HOBBO_MODEL_DIR: ${{ github.workspace }}/.cache/models
  LLAMA_CPP_DIR: ${{ github.workspace }}/.cache/llama.cpp
  LLAMA_CPP_REF: 6011c34ce6099646ccdf0d39a61c6e681477c178

jobs:
  model-smoke:
    name: Granite cognition + Nomic embeddings
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Hobbo
        uses: actions/checkout@v4

      - name: Install build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            curl \
            jq \
            ninja-build
          npm install --global pnpm@10.15.1
          pnpm install --no-frozen-lockfile

      - name: Restore GGUF cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/models
          key: hobbo-models-${{ runner.os }}-${{ hashFiles('models/models.lock.json') }}
          restore-keys: |
            hobbo-models-${{ runner.os }}-

      - name: Download and verify baseline GGUFs
        run: bash scripts/ci/download-models.sh all

      - name: Save GGUF cache immediately
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/models
          key: hobbo-models-${{ runner.os }}-${{ hashFiles('models/models.lock.json') }}

      - name: Restore pinned llama.cpp build
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/llama.cpp
          key: hobbo-llama-cpp-${{ runner.os }}-${{ env.LLAMA_CPP_REF }}

      - name: Checkout pinned llama.cpp
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "$LLAMA_CPP_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git "$LLAMA_CPP_DIR"
          git -C "$LLAMA_CPP_DIR" fetch --depth 1 origin "$LLAMA_CPP_REF"
          git -C "$LLAMA_CPP_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$LLAMA_CPP_DIR" rev-parse HEAD)" = "$LLAMA_CPP_REF"

      - name: Build pinned llama-server for CPU
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          cmake \
            -S "$LLAMA_CPP_DIR" \
            -B "$LLAMA_CPP_DIR/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF
          cmake --build "$LLAMA_CPP_DIR/build" --target llama-server --parallel 4

      - name: Save pinned llama.cpp build immediately
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/llama.cpp
          key: hobbo-llama-cpp-${{ runner.os }}-${{ env.LLAMA_CPP_REF }}

      - name: Verify test dependency versions
        run: |
          test "$(git -C "$LLAMA_CPP_DIR" rev-parse HEAD)" = "$LLAMA_CPP_REF"
          echo "llama.cpp commit: $(git -C "$LLAMA_CPP_DIR" rev-parse HEAD)"
          "$LLAMA_CPP_DIR/build/bin/llama-server" --version
          jq -r '.models | to_entries[] | "\(.key): \(.value.file) [\(.value.quantization)]"' models/models.lock.json

      - name: Smoke test Granite cognition
        env:
          LLAMA_SERVER: ${{ github.workspace }}/.cache/llama.cpp/build/bin/llama-server
        run: bash scripts/ci/smoke-granite.sh

      - name: Smoke test Nomic embeddings through provider
        env:
          LLAMA_SERVER: ${{ github.workspace }}/.cache/llama.cpp/build/bin/llama-server
          HOBBO_EMBEDDING_EXPECTED_DIMENSIONS: 768
        run: bash scripts/ci/smoke-nomic.sh
