name: Sprite Forge fixture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sprite-forge.yml'
      - 'tools/sprite-forge/**'
      - 'assets/source/**'
      - 'assets/definitions/**'
      - 'docs/ASSET_PIPELINE.md'
      - 'packages/rendering/**'
      - 'apps/client/**'
  pull_request:
    paths:
      - '.github/workflows/sprite-forge.yml'
      - 'tools/sprite-forge/**'
      - 'assets/source/**'
      - 'assets/definitions/**'
      - 'docs/ASSET_PIPELINE.md'
      - 'packages/rendering/**'
      - 'apps/client/**'

permissions:
  contents: read

concurrency:
  group: sprite-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    name: Deterministic Blender fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Hobbo
        uses: actions/checkout@v4

      - name: Install Blender + workspace
        run: |
          npm install --global pnpm@10.15.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender libegl1
          blender --version
          pnpm install --no-frozen-lockfile

      - name: Render fixture twice
        run: |
          mkdir -p .cache/sprite-forge/run-a .cache/sprite-forge/run-b
          blender --background --factory-startup \
            --python tools/sprite-forge/blender/render_fixture.py -- \
            --output-dir .cache/sprite-forge/run-a
          blender --background --factory-startup \
            --python tools/sprite-forge/blender/render_fixture.py -- \
            --output-dir .cache/sprite-forge/run-b

      - name: Validate fixture contract
        run: |
          python3 tools/sprite-forge/fixtures/validate_fixture.py \
            --output-dir .cache/sprite-forge/run-a
          python3 tools/sprite-forge/fixtures/validate_fixture.py \
            --output-dir .cache/sprite-forge/run-b
          python3 tools/sprite-forge/fixtures/validate_fixture.py \
            --compare .cache/sprite-forge/run-a .cache/sprite-forge/run-b

      - name: Validate renderer contract
        env:
          SPRITE_FORGE_OUTPUT: .cache/sprite-forge/run-a
        run: |
          pnpm --filter @hobbo/rendering validate:generated
          rm -rf apps/client/public/sprite-forge
          mkdir -p apps/client/public/sprite-forge
          cp -a .cache/sprite-forge/run-a/. apps/client/public/sprite-forge/
          pnpm --filter @hobbo/client build
          test -f apps/client/dist/sprite-forge/fixture_manifest.json
          test -f apps/client/dist/sprite-forge/fixture_atlas.png

      - name: Upload fixture output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprite-forge-minimal-fixture
          path: .cache/sprite-forge/run-a
          if-no-files-found: warn
