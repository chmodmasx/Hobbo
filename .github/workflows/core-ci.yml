name: Core simulation CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-ci.yml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'packages/**'
  pull_request:
    paths:
      - '.github/workflows/core-ci.yml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'packages/**'

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Typecheck + deterministic kernel tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Hobbo
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install --global pnpm@10.15.1

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test
