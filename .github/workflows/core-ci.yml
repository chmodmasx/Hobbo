name: Core simulation CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-ci.yml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'packages/**'
      - 'apps/**'
  pull_request:
    paths:
      - '.github/workflows/core-ci.yml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'packages/**'
      - 'apps/**'

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Typecheck + deterministic kernel tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Hobbo
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install --global pnpm@10.15.1

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

  database:
    name: PostgreSQL persistence integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hobbo
          POSTGRES_PASSWORD: hobbo
          POSTGRES_DB: hobbo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hobbo -d hobbo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: hobbo
      PGPASSWORD: hobbo
      PGDATABASE: hobbo

    steps:
      - name: Checkout Hobbo
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          npm install --global pnpm@10.15.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          pnpm install --no-frozen-lockfile

      - name: Apply database migrations
        run: |
          for migration in packages/database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Run SQL schema smoke checks
        run: |
          for check in packages/database/test/*.sql; do
            echo "Checking ${check}"
            psql -v ON_ERROR_STOP=1 -f "${check}"
          done

      - name: Run repository integration tests
        run: pnpm --filter @hobbo/database test:integration

      - name: Run runtime integration tests
        run: pnpm --filter @hobbo/runtime test:integration

      - name: Run realtime server integration tests
        run: pnpm --filter @hobbo/server test:integration
