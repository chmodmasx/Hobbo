<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobbo Realtime Client</title>
  </head>
  <body>
    <main class="shell">
      <header class="toolbar">
        <div class="identity">
          <strong>Hobbo realtime</strong>
          <span id="status">loading Sprite Forge output…</span>
        </div>
        <div class="session">
          <span>World: <code id="world-label">—</code></span>
          <span>Player: <code id="person-label">—</code></span>
          <span>Room: <code id="room-label">—</code></span>
        </div>
      </header>

      <section class="play-area">
        <section id="world" class="world" aria-label="Authoritative isometric room"></section>

        <aside class="movement-panel" aria-label="Movement controls">
          <strong>Move</strong>
          <div class="dpad">
            <button type="button" data-dx="-1" data-dy="-1" aria-label="North west">↖</button>
            <button type="button" data-dx="0" data-dy="-1" aria-label="North">↑</button>
            <button type="button" data-dx="1" data-dy="-1" aria-label="North east">↗</button>
            <button type="button" data-dx="-1" data-dy="0" aria-label="West">←</button>
            <span class="dpad-center">•</span>
            <button type="button" data-dx="1" data-dy="0" aria-label="East">→</button>
            <button type="button" data-dx="-1" data-dy="1" aria-label="South west">↙</button>
            <button type="button" data-dx="0" data-dy="1" aria-label="South">↓</button>
            <button type="button" data-dx="1" data-dy="1" aria-label="South east">↘</button>
          </div>
          <small>Arrow keys / WASD also move cardinally.</small>
          <div class="travel-control">
            <strong>Travel</strong>
            <select id="travel-destination" aria-label="Travel destination" disabled>
              <option value="">No destinations loaded</option>
            </select>
            <button id="travel-button" type="button" disabled>Travel</button>
            <small>Destinations come from the authoritative world topology.</small>
          </div>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
